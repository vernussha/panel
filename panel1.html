<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Доступ к Плану</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background: radial-gradient(circle at center, #0b0f17, #020409);
      color: #00ffcc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      letter-spacing: 0.2rem;
    }

    .terminal {
      background-color: #111;
      border: 2px solid #00ffcc;
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 0 20px #00ffcc50;
    }

    .symbols {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      letter-spacing: 0.1rem;
      opacity: 0.5;
    }

    input[type="text"] {
      background-color: #000;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 1.2rem;
      padding: 0.5rem;
      width: 200px;
      text-align: center;
      margin-bottom: 1rem;
    }

    button {
      background-color: transparent;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #00ffcc20;
    }

    #message {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="logo">C.R.I.D. // СИСТЕМА ДОСТУПА</div>
  <div class="terminal">
    <div class="symbols">∆ Ω § † ≡ ✦ Ξ ∎ ≠ ✱</div>
    <p>Введите код из 6 символов для доступа к плану:</p>
    <input type="text" id="codeInput" maxlength="6" />
    <br />
    <button onclick="checkCode()">Проверить</button>
    <div id="message"></div>
  </div>
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/15/audio_fa3972b03f.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <script>
    function checkCode() {
      const code = document.getElementById("codeInput").value.toLowerCase();
      const message = document.getElementById("message");

      if (code === "секрет") {
        message.innerText = "ОБРАТИТЕСЬ К ВЕДУЩЕМУ ДЛЯ ПОЛУЧЕНИЯ ИНФОРМАЦИИ"
      } else {
        message.innerText = "ОТКАЗАНО В ДОСТУПЕ";
        message.style.color = "#ff0040";
      }
    }
  </script>
</body>
</html>
